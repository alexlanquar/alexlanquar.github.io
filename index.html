<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Alexandre Lanquar</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- menu + titre -->
    <div style="display: flex; align-items: center; justify-content: center; flex-direction: line;">
        <img src="./images/base.png" id="character" alt="Personnage" style="position: absolute; left: 50px; top: 200px; width: 50px; height: auto; z-index: 1000; transition: transform 0.1s;">
        <div style="display: flex; align-items: center; justify-content: center; flex-direction: column;">
            <h1>Alexandre Lanquar</h1>
            <nav class="navbar">
                <button id="btn-home" class="nav-link active">Accueil</button>
                <button id="btn-travel" class="nav-link">Voyages</button>
                <button id="btn-projects" class="nav-link">Projets</button>
                <button id="btn-resume" class="nav-link">Contact & CV</button>
            </nav>
        </div>
    </div>
    <!-- home -->
    <section id="section-home" class="page-section">
    </section>
    <!-- projets -->
    <section id="section-projects" class="page-section hidden">
        <div class="projects-container">
            <h2>Projets</h2>
            <p>Voici quelques-uns de mes projets :</p>
            <div class="projects-list">
            </div>
        </div>

    </section>
    <!-- voyages -->
    <section id="section-travel" class="page-section hidden">
        <div class="travel-container">
            <h2>Voyages</h2>
            <p>Voici quelques photos de mes voyages :</p>
            <div class="travel-photos">
            </div>
        </div>
    </section>
    <!-- resume -->
    <section id="section-resume" class="page-section hidden">
        <div class="resume-container">
            <h2>Visualisation Curriculum Vitae</h2>
            <p class="instruction">Cliquez sur l'image pour voir le PDF.</p>
            <a href="./documents/ResumeFRAlexandreLanquar.pdf" target="_blank" class="pdf-link">
                <img src="images/Alexandre Lanquar CV Canada v2_page-0001.jpg" alt="Aperçu du CV" class="pdf-preview">
                <img src="images/Alexandre Lanquar CV Canada v2_page-0002.jpg" alt="Aperçu du CV" class="pdf-preview">
            </a>
        </div>
    </section>
    <!-- audio -->
    <div class="audio-container" style="display: none;">
        <audio id="bg-music" loop>
            <source src="./audio/lofi-videogame.mp3" type="audio/mpeg">
        </audio>
    </div>
    <!-- mute btn -->
    <button id="mute-btn" class="audio-button" title="Couper / Activer le son">
        <img src="./images/unmute.png" id="mute-icon" alt="Volume">
    </button>
    <!-- footer -->
    <footer id="contact-section">
        <p id="pcopyright">Music : gingersweet - massobeats</p>
    </footer>
    <!-- script -->
    <script src="./script.js"></script>
</body>
</html>
