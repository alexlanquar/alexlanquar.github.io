<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Alexandre Lanquar</title>
    <link rel="stylesheet" href="./index_style.css">
    <!-- prechargement pour l'image de marche -->
    <link rel="preload" href="./images/right_walk.gif" as="image">
</head>
<body class="page-home" data-page="home">
    <div id="character-wrapper" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1000; display: flex; flex-direction: column; align-items: center; pointer-events: none;">
        <span id="action-text" style="background: rgba(0, 0, 0, 0.75); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-family: sans-serif; white-space: nowrap; opacity: 0; visibility: hidden; position: absolute; bottom: 100%; transform: translateY(-6px); transition: opacity 0.15s, visibility 0.15s;">
            Appuyez sur Entrée ↵
        </span>
        <img src="./images/base.png" id="character" alt="Personnage" style="width: 40px; height: auto; transition: transform 0.1s;">
    </div>

    <div id="game-world" style="position: relative; width: 100%; min-height: 80vh;">
        <div class="room-scene">
            <div class="room-floor"></div>
            <div class="room-outline"></div>

            <!-- Murs du village (invisibles, bloquent la sortie) -->
            <div class="wall obstacle" style="left: 3%;  top: 3%;  width: 94%; height: 2%;"></div>
            <div class="wall obstacle" style="left: 3%;  top: 93%; width: 94%; height: 2%;"></div>
            <div class="wall obstacle" style="left: 3%;  top: 3%;  width: 2%;  height: 92%;"></div>
            <div class="wall obstacle" style="left: 95%; top: 3%;  width: 2%;  height: 92%;"></div>

            <!-- Maison "Voyages" -->
            <div class="prop prop--accent obstacle" style="left: 66%; top: 10%; width: 22%; height: 24%;">✈️
                <span class="prop-label">Voyages</span>
            </div>

            <!-- Puits (déco, au centre) -->
            <div class="prop prop--stone prop--circle" style="left: 46%; top: 52%; width: 8%; height: 8%;">💧</div>

            <!-- Maison "Projets" -->
            <div class="prop prop--warm obstacle" style="left: 10%; top: 60%; width: 20%; height: 24%;">🛠️
                <span class="prop-label">Projets</span>
            </div>

            <!-- Maison "Contact & CV" -->
            <div class="prop obstacle" style="left: 66%; top: 60%; width: 20%; height: 24%;">📇
                <span class="prop-label">Contact & CV</span>
            </div>
        </div>

        <!-- Boutons placés en coordonnées absolues par rapport au fond -->
         <div style="display: flex; align-items: center; justify-content: center; flex-direction: column; position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 2;">
                <h1>Bienvenue sur le site de</h1>
                <h1>Alexandre Lanquar</h1>
        </div>

        <!-- Points interactifs : juste devant chaque maison, jamais dedans -->
        <button id="btn-travel" class="nav-link" style="left: 77%; top: 36%; width: 90px; height: 55px; z-index: 5;">Voyages</button>
        <button id="btn-projects" class="nav-link" style="left: 20%; top: 86%; width: 90px; height: 55px; z-index: 5;">Projets</button>
        <button id="btn-desk" class="nav-link" style="left: 76%; top: 86%; width: 90px; height: 55px; z-index: 5;">Contact & CV</button>
    </div>

    

    <!-- home -->
    <section id="section-home" class="page-section">
    </section>
    
    <!-- voyages -->
    <section id="section-travel" class="page-section hidden">
        <div class="travel-container">
            <h2>Voyages</h2>
            <p>Voici quelques photos de mes voyages :</p>
            <div class="travel-photos">
            </div>
        </div>
    </section>

    <!-- resume -->
    <section id="section-resume" class="page-section hidden">
        
    </section>
    <!-- audio -->
    <div class="audio-container" style="display: none;">
        <audio id="bg-music" loop>
            <source src="./audio/lofi-videogame.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- mute btn -->
    <button id="mute-btn" class="audio-button" title="Couper / Activer le son">
        <img src="./images/unmute.png" id="mute-icon" alt="Volume">
    </button>

    <!-- footer -->
    <footer id="contact-section">
        <p id="pcopyright">Music : gingersweet - massobeats</p>
    </footer>
    <!-- script -->
    <script src="./script.js"></script>
</body>
</html>
