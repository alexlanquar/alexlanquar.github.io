<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Alexandre Lanquar</title>
    <link rel="stylesheet" href="./desk_style.css">
        <!-- prechargement pour l'image de marche -->
    <link rel="preload" href="./images/right_walk.gif" as="image">
</head>

<body>  
    <div id="character-wrapper" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1000; display: flex; flex-direction: column; align-items: center; pointer-events: none;">
        <span id="action-text" style="background: rgba(0, 0, 0, 0.75); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-family: sans-serif; white-space: nowrap; opacity: 0; visibility: hidden; position: absolute; bottom: 100%; transform: translateY(-6px); transition: opacity 0.15s, visibility 0.15s;">
            Appuyez sur Entrée ↵
        </span>
        <img src="./images/base.png" id="character" alt="Personnage" style="width: 40px; height: auto; transition: transform 0.1s;">
    </div>

    <div id="game-world" style="position: relative; width: 100%; min-height: 80vh; background-image: url('./images/votre_fond.jpg'); background-size: cover; background-position: center;">
        <button id="btn-home" class="nav-link active" style="position: absolute; left: 15%; top: 20%;">Accueil</button>
        <button id="btn-cv" class="nav-link active" style="position: absolute; left: 85%; top: 40%;">CV</button>
    </div>

    <!-- mute btn -->
    <button id="mute-btn" class="audio-button" title="Couper / Activer le son">
        <img src="./images/unmute.png" id="mute-icon" alt="Volume">
    </button>

    <!-- footer -->
    <footer id="contact-section">
        <p id="pcopyright">Music : gingersweet - massobeats</p>
    </footer>
    <!-- script -->
    <script src="./script.js"></script>
</body>
</html>
