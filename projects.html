<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Alexandre Lanquar</title>
    <link rel="stylesheet" href="./index_style.css">
        <!-- prechargement pour l'image de marche -->
    <link rel="preload" href="./images/right_walk.gif" as="image">
</head>

<body class="page-projects" data-page="projects">
    <div id="character-wrapper" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1000; display: flex; flex-direction: column; align-items: center; pointer-events: none;">
        <span id="action-text" style="background: rgba(0, 0, 0, 0.75); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-family: sans-serif; white-space: nowrap; opacity: 0; visibility: hidden; position: absolute; bottom: 100%; transform: translateY(-6px); transition: opacity 0.15s, visibility 0.15s;">
            Appuyez sur Entrée ↵
        </span>
        <img src="./images/base.png" id="character" alt="Personnage" style="width: 40px; height: auto; transition: transform 0.1s;">
    </div>

    <div id="game-world" style="position: relative; width: 100%; min-height: 80vh;">
        <div class="room-scene">
            <div class="room-floor"></div>
            <div class="room-wall"></div>
            <div class="room-outline"></div>
            <div class="room-title">🛠️ Projets</div>

            <!-- Murs de la pièce (invisibles, bloquent la sortie) -->
            <div class="wall obstacle" style="left: 3%;  top: 3%;  width: 94%; height: 2%;"></div>
            <div class="wall obstacle" style="left: 3%;  top: 93%; width: 94%; height: 2%;"></div>
            <div class="wall obstacle" style="left: 3%;  top: 3%;  width: 2%;  height: 92%;"></div>
            <div class="wall obstacle" style="left: 95%; top: 3%;  width: 2%;  height: 92%;"></div>

            <!-- Établi (décor + obstacle) -->
            <div class="prop obstacle" style="left: 28%; top: 40%; width: 26%; height: 16%;">🛠️
                <span class="prop-label">Établi</span>
            </div>
            <!-- Étagère à outils (décor + obstacle) -->
            <div class="prop obstacle" style="left: 68%; top: 22%; width: 16%; height: 34%;">📚</div>
            <!-- Boîte à outils (décor + obstacle) -->
            <div class="prop prop--accent obstacle" style="left: 10%; top: 60%; width: 12%; height: 12%;">🧰</div>
            <!-- Porte de sortie -->
            <div class="exit-door" style="left: 44%; top: 82%; width: 12%; height: 12%;"></div>
        </div>

        <!-- Repositionne left/top pour rester calé sur la porte dessinée ci-dessus -->
        <button id="btn-home" class="nav-link exit-link" style="left: 50%; top: 86%; width: 90px; height: 60px; z-index: 5;">Retour à l'accueil</button>
    </div>

    <!-- mute btn -->
    <button id="mute-btn" class="audio-button" title="Couper / Activer le son">
        <img src="./images/unmute.png" id="mute-icon" alt="Volume">
    </button>

    <!-- footer -->
    <footer id="contact-section">
        <p id="pcopyright">Music : gingersweet - massobeats</p>
    </footer>
    <!-- script -->
    <script src="./script.js"></script>
</body>
</html>
